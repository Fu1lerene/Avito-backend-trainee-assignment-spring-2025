services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: avito
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5544:5432"

  app:
    build:
      context: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/avito?sslmode=disable
    ports:
      - "8080:8080"

  migrate:
    image: golang:1.24
    depends_on:
      - db
    volumes:
      - .:/app
    working_dir: /app
    entrypoint: >
      sh -c "
      go install github.com/pressly/goose/v3/cmd/goose@latest &&
      goose -dir ./internal/migrations postgres 'postgres://postgres:postgres@db:5432/avito?sslmode=disable' up
      "

volumes:
  pgdata:
